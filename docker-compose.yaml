# Project Zomboid (Build 42) server + playit.gg tunnel, on two prebuilt images.
# Setup and day-to-day use live in README.md. The comments here are only the
# things you need to know before EDITING this file.
#
# Why this runs on Apple Silicon: the PZ server is x86-only and is installed by
# SteamCMD, whose bootstrap is 32-bit x86 and does not emulate cleanly on ARM64.
# This image bakes the server in at build time, so at runtime only the 64-bit
# Java server runs. Setting FORCEUPDATE brings SteamCMD back at boot and with it
# that whole problem.
#
# Compose reads .env for BOTH the ${...} substitutions below AND the pz
# container's own environment.

# Without this, json-file logs grow forever and fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  pz:
    # Pinned so a routine `pull` can't drop in a save-incompatible patch: a build
    # that adds map content makes existing worlds unloadable, and clients can't
    # join a server on a different build than theirs.
    image: danixu86/project-zomboid-dedicated-server:42.20.3-release
    container_name: ${NAME:-pz}

    # danixu86 publishes amd64 only, so pin it and let ARM64 hosts emulate.
    platform: linux/amd64

    # `format: raw` passes values LITERALLY, so a password with $ or quotes
    # arrives intact. The catch: a trailing "# comment" on a KEY=VALUE line in
    # .env becomes part of the value.
    env_file:
      - path: .env
        format: raw

    # Do NOT mount anything onto the install dir (/home/steam/pz-dedicated), the
    # server is baked in there and a mount would hide it.
    #
    # Exception, if the game ever patches before danixu86 publishes a matching
    # tag: pull the depots yourself and mount them over the install dir until the
    # image catches up (done once for 42.20.3, undone a day later).
    #   DepotDownloader -app 380870 -os linux -osarch 64 -dir server-install
    # SteamCMD can NOT do that job on Apple Silicon: its 32-bit x86 bootstrap
    # fails under Rosetta and segfaults under i386 emulation, both times exiting
    # 0 having written nothing.
    volumes:
      - ./server-data/Zomboid:/home/steam/Zomboid
      - ./server-data/workshop:/home/steam/pz-dedicated/steamapps/workshop

    # Only for same-LAN direct connections. The playit tunnel doesn't need these;
    # it reaches pz over the private bridge.
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"

    # playit forwards to THIS address, so keeping it static means pz can crash,
    # get OOM-killed, or be recreated for an image bump without the tunnel's
    # target moving. Leave the PZ server's own bind address unset; it already
    # binds every interface and rejects an explicit -ip/0.0.0.0.
    networks:
      tnc:
        ipv4_address: 172.28.0.10

    mem_limit: ${CONTAINER_MEMORY:-16g}
    cpus: ${CONTAINER_CPUS:-8}

    # This image does NOT trap SIGTERM to save, so a plain `stop` falls back to
    # autosave and loses the last few minutes. Use scripts/graceful-stop.sh.
    # stdin_open/tty exist so `docker attach pz` can reach the server console.
    stop_grace_period: ${STOP_GRACE:-120}s
    stdin_open: true
    tty: true

    # `unless-stopped`, not `on-failure`, so the stack also comes back after a
    # host reboot or a runtime restart and stays down only after a deliberate
    # `stop`. Two host-side requirements: the container runtime has to start on
    # boot/login, and the host must not sleep. Neither restart policy nor
    # healthcheck can help a suspended machine.
    restart: unless-stopped

    # RCON only starts listening once the world has finished loading, so passing
    # means "actually up" rather than "booting". The image has bash but no
    # netcat. An unhealthy status does NOT restart anything on its own; that's
    # what the autoheal sidecar below is for.
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/27015'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

    # Safe despite the entrypoint's root -> steam `su`, which is a privilege DROP.
    security_opt:
      - no-new-privileges:true

    # PZ never uses raw sockets. Side effect: no `ping` inside the container.
    cap_drop:
      - NET_RAW

    # pids_limit counts THREADS, and an emulated JVM plus steam runs into the
    # hundreds, so keep it generous or the server dies with "unable to create
    # native thread".
    pids_limit: 4096
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # Reap orphaned children; the entrypoint su's to a child and never exec's.
    # Does not change stop behavior, SIGTERM still isn't relayed to the JVM.
    init: true

    logging: *default-logging

    labels:
      autoheal: "true"
      autoheal.stop.timeout: "120"

  playit:
    # Pinned so a `pull` can't swap in a regressed agent. Bump deliberately after
    # checking the GHCR tags; :1.0 would track patches automatically.
    image: ghcr.io/playit-cloud/playit-agent:1.0.10
    container_name: ${NAME:-pz}-playit

    # Its own network stack, not pz's namespace. Decoupled lifecycle is the
    # point: the old `network_mode: service:pz` killed playit's networking every
    # time pz cycled, and no restart policy recovered it.
    networks:
      - tnc

    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY}
      # Startup noise, NOT a failure: the agent's first control-server candidate
      # is always IPv6, this container has none, so it logs two ERROR lines and
      # falls straight through to IPv4. There's no IPv4-only flag. Silencing it
      # also hides genuine ping failures from that module:
      # PLAYIT_LOG: "info,playit_agent_core::agent_control::address_selector=off"

    depends_on:
      - pz
    restart: unless-stopped

    # The internet-facing piece is the one most worth confining. The agent is
    # outbound-only and writes nothing but its IPC socket under /run. Verified
    # against 1.0.10; if a future bump crash-loops it started writing somewhere
    # new and needs another tmpfs.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /run
    logging: *default-logging

  # Flushes the world to disk on demand. Held behind a profile so it never starts
  # with `up`. Normally you want scripts/graceful-stop.sh, which wraps this.
  #   docker compose run --rm rcon save
  #   docker compose run --rm rcon players   # confirm RCON is live
  # Don't send `quit`: pz is restart: unless-stopped, so the exit reads as a crash
  # and it comes straight back. If RCONPASSWORD contains a literal $, double it.
  rcon:
    image: outdead/rcon:latest
    profiles: ["tools"]
    networks:
      - tnc
    entrypoint: ["/rcon", "-a", "172.28.0.10:27015", "-p", "${RCONPASSWORD}"]

  # restart: unless-stopped already handles a crash or OOM. The gap it can't see
  # is a server that's alive but deadlocked, which is what this restarts. Two
  # costs: it mounts the Docker socket (root-equivalent on the host), and the
  # restart is a SIGKILL, so a FALSE unhealthy loses progress back to the last
  # autosave. pz's 600s start_period keeps a slow emulated boot from tripping it.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: ${NAME:-pz}-autoheal
    depends_on: [pz]
    restart: unless-stopped
    network_mode: none
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 300
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

# The explicit subnet is what lets pz claim a fixed ipv4_address for playit to
# target. IPv4-only because container IPv6 is inconsistent across hosts. If this
# range collides with something on your host, change it here AND in the tunnel's
# Local address on playit.gg.
networks:
  tnc:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
