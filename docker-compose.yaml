# ─────────────────────────────────────────────────────────────────────────────
# Project Zomboid (Build 42) dedicated server + playit.gg tunnel.
#
# TWO prebuilt images, NO custom build. Everything lives in this file + .env:
#   • pz     — the game server (danixu86 image, Build 42 "unstable" branch)
#   • playit — the playit.gg tunnel agent on a private bridge network with pz; it
#              forwards internet traffic to the server at pz's fixed container IP
#              (172.28.0.10). No published host ports, no router port-forwarding.
#
# Runtime-agnostic: this is a standard Compose file. Bring it up with Docker,
# OrbStack, or any other Compose-compatible runtime — the file doesn't care which.
#
# ── Why this runs on any CPU architecture ────────────────────────────────────
# Project Zomboid's server is x86-only and is installed by SteamCMD, whose
# bootstrap is a 32-bit x86 binary. Installing it is the fragile part — on ARM64
# hosts (Apple Silicon, Raspberry Pi, ARM cloud) that 32-bit x86 bootstrap can't
# be emulated cleanly. THIS image sidesteps that: the danixu86 image has the
# server BAKED IN at build time (the SteamCMD install ran on danixu's amd64 CI,
# not on your host). At runtime only the 64-bit Java server runs — no SteamCMD —
# as long as FORCEUPDATE is unset. So the same image "just runs" everywhere:
# native on x86-64 hosts, and under lightweight emulation on ARM64.
#
# ── Build 42 is a BETA (unstable) branch ─────────────────────────────────────
# B42 multiplayer lives on Steam's "unstable" branch. It works but: expect bugs,
# updates can break saves, keep the group small (Indie Stone suggests <= 20 and
# whitelisting), and give it plenty of RAM (8–9 GB+). To update the server, pull
# a fresh image (see UPDATING below) — that re-fetches danixu's newest B42 build.
#
# ── Quick start ──────────────────────────────────────────────────────────────
#   cp .env.example .env          # then edit it (playit key, passwords, ...)
#   docker compose up -d          # pull images + start in the background
#   docker compose logs -f        # watch the logs (first boot loads the world)
#   docker compose down           # stop + remove containers (world data persists)
#
# ── How friends connect ──────────────────────────────────────────────────────
# 1. In the playit.gg dashboard create ONE tunnel:
#      Type = Project Zomboid  (or: Protocol UDP, Port Count 2)
#      Local address = 172.28.0.10   Local port = 16261
#    (172.28.0.10 = pz's fixed IP on the private bridge defined at the BOTTOM of
#    this file. The agent has NO DNS, so this must be that literal IP — a service
#    name like "pz" will NOT work. It used to be 127.0.0.1 when playit shared pz's
#    network namespace; that's changed — update the dashboard to this IP.)
#    playit gives you a public address like  something.playit.gg:PORT
# 2. In-game: Join → Add Server / connect by IP → enter that host + public port,
#    UNCHECK "Use Steam Relay", and join with your SERVER_PASSWORD.
#    Give friends only the FIRST port; PZ uses the +1 port itself (that's why the
#    tunnel covers 2 ports).
#
# ── UPDATING (new B42 patch) ─────────────────────────────────────────────────
# The pz image tag below is now PINNED, so `docker compose pull` won't bump the
# version on its own. To update: back up ./server-data/Zomboid, bump the pz image
# tag below to the new build, then:
#   docker compose pull && docker compose up -d --force-recreate
# Your world in ./server-data/ is untouched by the swap. If clients auto-update to
# a B42 patch newer than the pinned tag, they can't join until you bump it (that
# controlled lag is the point of pinning).
#
# NOTE: Compose reads .env from this directory for BOTH the ${...} substitutions
# below AND the pz container's own environment (via env_file, format: raw).
# ─────────────────────────────────────────────────────────────────────────────

# Cap Docker's json-file logs so a stack that runs for weeks can't fill the disk.
# The default is unlimited size with no rotation. Both services share this anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  pz:
    # Prebuilt Build 42 server (server files baked in; no SteamCMD at runtime).
    # Pinned to the B42 build this world was created on so a routine `pull` can't
    # drop in a save-incompatible patch. Bump deliberately (back up first).
    # For Build 41 stable instead, use :latest (or :latest-release).
    image: danixu86/project-zomboid-dedicated-server:42.19.0-unstable
    container_name: ${NAME:-pz}

    # danixu86 publishes amd64 only. This pins amd64 regardless of host arch:
    # a no-op (native) on x86-64 hosts, and emulation on ARM64 hosts.
    platform: linux/amd64

    # Server config (name, passwords, ports, memory, mods) is injected from .env.
    # `format: raw` passes every value LITERALLY — no ${...} interpolation, no
    # quote-stripping — so a password with $, spaces, or quotes arrives exactly as
    # written. Consequence: keep "# comments" on their OWN lines in .env, never
    # trailing a KEY=VALUE line (the comment would become part of the value).
    env_file:
      - path: .env
        format: raw

    # Persistent data on the host — survives `down` and image updates.
    #   Zomboid/  = your world, saves, server .ini, player DB, logs  ← BACK THIS UP
    #   workshop/ = downloaded Steam Workshop mods (only used if you enable mods;
    #               see MOD_IDS / WORKSHOP_IDS + FORCEUPDATE in .env)
    # Do NOT mount anything onto the install dir (/home/steam/pz-dedicated) — the
    # server is baked into the image there; a mount would hide it and break boot.
    volumes:
      - ./server-data/Zomboid:/home/steam/Zomboid
      - ./server-data/workshop:/home/steam/pz-dedicated/steamapps/workshop

    # No `ports:` on purpose — playit reaches pz directly over the private bridge
    # (at pz's fixed IP), so nothing needs publishing to the host. To ALSO allow
    # same-LAN direct connections, uncomment these (the tunnel does not need them):
    # ports:
    #   - "16261:16261/udp"
    #   - "16262:16262/udp"

    # Fixed IP on the private bridge (see `networks:` at the BOTTOM of this file).
    # playit forwards to THIS address; keeping it static means pz can crash, run
    # out of memory and get killed, or be recreated for an image update without
    # the tunnel's target ever changing. The PZ server already binds all interfaces (leave its bind
    # address unset — do NOT set -ip/0.0.0.0, which PZ rejects), so it's reachable
    # here. No ports: needed for playit — same-bridge containers reach every port.
    networks:
      tnc:
        ipv4_address: 172.28.0.10

    # Resource caps. Keep CONTAINER_MEMORY comfortably above MAX_MEMORY in .env.
    mem_limit: ${CONTAINER_MEMORY:-16g}
    cpus: ${CONTAINER_CPUS:-8}

    # Graceful-ish shutdown. Heads up: this image does NOT trap SIGTERM to force a
    # save, so a plain `docker compose stop` relies on Project Zomboid's autosave
    # (you may lose the last few minutes). For a GUARANTEED save, use the server
    # console: `docker attach pz`, type  save  then  quit  (it saves and exits),
    # or detach without stopping via Ctrl-P Ctrl-Q. stdin_open/tty enable that.
    stop_grace_period: ${STOP_GRACE:-120}s
    stdin_open: true
    tty: true

    # `unless-stopped` = relaunch after a crash, a runtime restart, AND a host reboot,
    # but stay down after a deliberate `docker compose stop`. This is the single
    # biggest fix for "the server was offline / playit died overnight": the old
    # `on-failure` did NOT relaunch after a clean stop or a reboot, so the stack
    # stayed down until manually restarted. Two host-level requirements for reboot
    # recovery to actually work, on ANY OS/runtime:
    #   1. The container runtime must start on boot/login (a restart policy only fires
    #      once the runtime is back up). Enable "start at login" for a desktop runtime,
    #      or the equivalent service on a Linux host.
    #   2. Keep the host awake — a sleeping machine suspends the whole runtime and NO
    #      restart policy can help. Disable sleep in your OS power settings on any box
    #      you leave running as a server.
    # If your runtime doesn't auto-start this stack after ITS OWN restart, switch BOTH
    # services to `restart: always` (the only downside: a manual `stop` won't persist
    # across a runtime restart).
    restart: unless-stopped

    # ── Resilience + hardening (added) ───────────────────────────────────────
    # Liveness signal. RCON (27015/tcp) only starts listening after the world
    # finishes loading, so a passing check means "actually up", not just booting.
    # The image ships bash but no netcat, so probe with bash's /dev/tcp builtin.
    # Heads up: on standalone Docker/OrbStack an "unhealthy" status does NOT
    # restart the container (the restart policy fires only when the process exits).
    # This is for `docker ps` visibility; see the commented autoheal block to act on it.
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/27015'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

    # Block privilege escalation via setuid binaries. Safe here: the entrypoint's
    # root -> steam `su` is a privilege DROP, which this flag doesn't touch.
    security_opt:
      - no-new-privileges:true

    # PZ uses ordinary UDP/TCP sockets, never raw sockets. Dropping NET_RAW also
    # disables `ping` from inside the container (use nc/curl to debug the bridge).
    cap_drop:
      - NET_RAW

    # Bound the process/thread blast radius; give the JVM plenty of file handles.
    # pids_limit counts THREADS, not processes, so keep it generous (an emulated
    # JVM plus steam runs into the hundreds). Do NOT lower toward 512/1024 or the
    # server can crash with "unable to create native thread".
    pids_limit: 4096
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # Reap orphaned children (the entrypoint su's to a child and never exec's).
    # This does NOT change stop behavior: SIGTERM still isn't relayed to the JVM,
    # so a guaranteed save still needs RCON `save` (see the `rcon` service below).
    init: true

    logging: *default-logging

    # Let the autoheal sidecar (below) restart pz if the healthcheck goes
    # unhealthy. stop.timeout matches stop_grace_period; the restart is a SIGKILL
    # after that (this image ignores SIGTERM), so a FALSE unhealthy costs progress
    # back to the last autosave.
    labels:
      autoheal: "true"
      autoheal.stop.timeout: "120"

  playit:
    # Official headless playit.gg agent, PINNED so a `docker compose pull` can't
    # silently swap in a regressed build. 1.0.10 (2026-06-08) is the current, healthy
    # release; bump deliberately after checking the tags on GitHub's Container
    # Registry (GHCR). (Use :1.0 instead if you want automatic patch-level
    # updates within the 1.0.x line.)
    image: ghcr.io/playit-cloud/playit-agent:1.0.10
    container_name: ${NAME:-pz}-playit

    # On the SAME private bridge as pz, but with its OWN network stack (no longer
    # pz's namespace). It reaches the server at pz's fixed IP 172.28.0.10:16261 over
    # the bridge and gets its own outbound internet to playit.gg. Decoupled lifecycle
    # is the point: pz can restart/recreate without stranding the tunnel (the old
    # `network_mode: service:pz` silently killed playit's networking whenever pz
    # cycled, and no restart policy recovered it).
    networks:
      - tnc

    # The agent's entrypoint maps SECRET_KEY -> `playitd --secret ...` and adds
    # --platform-docker automatically. We feed it from PLAYIT_SECRET_KEY in .env.
    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY}
      # HARMLESS startup noise, NOT a failure: the two ERROR lines about
      #   [2602:fbaf:...]:5525 "Network unreachable" / "failed to ping tunnel server"
      # happen because this container has no IPv6, so the agent's first control-server
      # candidate (always IPv6) fails instantly and it falls straight through to IPv4
      # — which is why "playit connected; tunnels loaded" prints right after. There is
      # no IPv4-only flag in the agent. To silence just those lines (note: this also
      # hides genuine ping failures from that same module), uncomment:
      # PLAYIT_LOG: "info,playit_agent_core::agent_control::address_selector=off"

    # Start pz first (ordering only — no longer a hard network dependency).
    depends_on:
      - pz
    # Match pz: always-on, survives crashes / runtime restart / host reboot.
    # See the pz `restart:` note above for the host requirements (any OS/runtime).
    restart: unless-stopped

    # ── Hardening (added) ────────────────────────────────────────────────────
    # The internet-facing tunnel is the piece most worth confining. It's a single
    # outbound-only agent: it needs zero Linux capabilities and writes nothing to
    # disk except its IPC socket under /run (so /run is a tmpfs and the rest is
    # read-only). Verified against the pinned 1.0.10 agent. If a future image bump
    # crash-loops at boot it started writing somewhere new; add a tmpfs line for it.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /run
    logging: *default-logging

  # ── On-demand RCON (added; never autostarts) ────────────────────────────────
  # The image doesn't save on SIGTERM, so a plain `stop` leans on autosave. This
  # profile-gated helper flushes the world to disk on demand and never starts with
  # `up` (profiles: [tools]). For a guaranteed-save stop:
  #   docker compose run --rm rcon save    # flush world + player DB to disk
  #   docker compose stop pz               # the kill is now harmless; save is on disk
  # Don't use `quit`: pz is restart: unless-stopped, so a quit-exit looks like a
  # crash and Docker relaunches pz before you can stop it. Confirm RCON is live with:
  #   docker compose run --rm rcon players
  # (RCONPASSWORD comes from .env via compose interpolation; if yours contains a
  #  literal `$`, double it to `$$` here or the value won't match.)
  rcon:
    image: outdead/rcon:latest
    profiles: ["tools"]
    networks:
      - tnc
    entrypoint: ["/rcon", "-a", "172.28.0.10:27015", "-p", "${RCONPASSWORD}"]

  # ── Auto-restart a HUNG pz (autoheal) ───────────────────────────────────────
  # restart: unless-stopped already covers a crash/OOM (the process exits and
  # Docker relaunches it). The one gap it can't see is a server that's alive but
  # deadlocked. autoheal watches pz's healthcheck and restarts pz when it goes
  # "unhealthy". Two tradeoffs to know:
  #   1. It mounts the Docker socket = root-equivalent access to the host.
  #   2. The restart is a SIGKILL (this image ignores SIGTERM), so a FALSE unhealthy
  #      loses progress back to the last autosave. The healthcheck's generous
  #      start_period (600s) keeps a slow emulated boot reading as "starting", not dead.
  # Scoped to the `autoheal: "true"` label on pz, so it only ever touches pz.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: ${NAME:-pz}-autoheal
    depends_on: [pz]
    restart: unless-stopped
    network_mode: none
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 300
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

# ── Private bridge shared by pz + playit ─────────────────────────────────────
# The explicit subnet is what lets pz claim a fixed ipv4_address (172.28.0.10)
# that the playit tunnel targets. IPv4-only on purpose (container IPv6 is
# inconsistent across runtimes/hosts). If 172.28.0.0/24 collides with another
# network on your host, change it here AND update the tunnel's Local address in the
# playit.gg dashboard to match.
networks:
  tnc:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
